<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/AI-ML_Logo.ico" />
    <link rel="apple-touch-icon" href="/AI-ML_Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI/ML Lab Portal — Internal Management Platform" />
    <meta name="theme-color" content="#0d1117" />
    <title>AI/ML Lab Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- ⚡ Early error trap — runs BEFORE any ES module. Catches import failures that
         would otherwise silently blank the page. Must be a plain script, not type=module. -->
    <script>
      (function () {
        var TIMEOUT = 10000; // ms to wait before declaring "stuck"
        var errors = [];

        function showPanic(title, body) {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="padding:40px;font-family:monospace;background:#0d1117;color:#f85149;min-height:100vh">' +
            '<h2 style="margin-top:0">&#9888; ' + title + '</h2>' +
            '<pre style="white-space:pre-wrap;color:#e6edf3;background:#161b22;padding:16px;border-radius:6px;overflow:auto">' + body + '</pre>' +
            (errors.length > 1 ? '<pre style="color:#d29922;font-size:12px">' + errors.slice(1).join('\n\n') + '</pre>' : '') +
            '<div style="margin-top:24px;display:flex;gap:12px">' +
            '<button onclick="location.reload()" style="padding:8px 16px;background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;cursor:pointer">Reload</button>' +
            '<button onclick="localStorage.clear();sessionStorage.clear();location.reload()" style="padding:8px 16px;background:#f85149;color:#fff;border:none;border-radius:6px;cursor:pointer">Clear storage &amp; reload</button>' +
            '</div></div>';
        }

        window.addEventListener('error', function (e) {
          var msg = (e.message || 'Unknown error') + '\n  ' + (e.filename || '') + ':' + e.lineno + ':' + e.colno;
          if (e.error && e.error.stack) msg += '\n\n' + e.error.stack;
          errors.push(msg);
          showPanic('JavaScript Error', errors[0]);
        });

        window.addEventListener('unhandledrejection', function (e) {
          var msg = 'Unhandled Promise Rejection:\n' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
          errors.push(msg);
          if (errors.length === 1) showPanic('Async Error', msg);
        });

        // Blank-page watchdog: if #root is still empty after TIMEOUT ms, show diagnostic
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && errors.length === 0) {
            showPanic('App did not render', 
              'React never mounted after ' + (TIMEOUT/1000) + 's.\n\n' +
              'Possible causes:\n' +
              '  • A module failed to load (check Network tab for 404/500)\n' +
              '  • A top-level import threw an exception before React ran\n' +
              '  • Zustand persist hydration crashed the store\n\n' +
              'Open browser DevTools → Console for details.\n' +
              'Then click "Clear storage & reload" below.');
          }
        }, TIMEOUT);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
