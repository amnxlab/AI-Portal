server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Hashed build output — safe to cache forever, because the filename
    # changes whenever the contents do.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached.
    #
    # It is the only file that names the hashed chunks, so a cached copy sends
    # the browser after files that a later deploy has already removed — which
    # surfaces as "error loading dynamically imported module" on whichever
    # page the user happens to open next. It had no cache header at all, so
    # browsers cached it heuristically and the error came back for days.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # SPA fallback — client-side routing. The same no-store rule applies,
    # since this serves index.html under every unmatched path.
    location / {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
