# ── nginx-dev.conf ────────────────────────────────────────────────────────────
#  Development reverse-proxy for portal.lan
#
#  Plain HTTP on port 8080. No SSL in dev — keeps things simple.
#  Proxies to NestJS (4000) and Vite (5173) on the host via loopback
#  (network_mode: host on Linux).
# ─────────────────────────────────────────────────────────────────────────────

# Map the Upgrade header so only real WebSocket handshakes get
# Connection: upgrade. Regular HTTP requests get Connection: close,
# preventing stalled keep-alive connections to the backend and Vite.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 0.0.0.0:8080;
    server_name portal.lan 127.0.0.1 localhost;

    # Allow large file uploads (ZIP files up to 10 GB)
    client_max_body_size 10g;
    client_body_timeout  3600s;

    # NestJS backend
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_request_buffering off;
    }

    # Socket.IO (NestJS realtime gateway)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_read_timeout 60s;
    }

    # Launcher installer download
    location /launcher/ {
        alias /opt/aiml-launcher/;
        autoindex on;
    }

    # Vite HMR WebSocket
    location /__vite_hmr {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # Vite dev server — pages and assets
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;
    }
}
