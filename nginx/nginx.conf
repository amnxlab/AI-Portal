# HTTPS via the mkcert-issued certificate in ./certs (server.crt / server.key,
# signed by rootCA.pem). Port 80 exists only to redirect and to hand out the
# root CA for devices that haven't trusted it yet — trusting the CA is a
# one-time step per device (see /rootCA.pem below); the connection is
# encrypted either way, trust just removes the browser warning.

# Use Docker's embedded DNS so upstream hostnames are resolved at request time,
# not at startup. This prevents nginx from refusing to start when backend/frontend
# containers are temporarily unavailable during a restart.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Port 80: redirect to HTTPS, except the CA download ─────────────────────
server {
    listen 80;
    server_name _;   # any name: the public host, the LAN name, or an IP

    # Serve the root CA over plain HTTP so a device can fetch and trust it
    # BEFORE it trusts this server's certificate — if this were only reachable
    # over HTTPS, an untrusting browser would block the download with the very
    # warning the CA install is meant to remove.
    location = /rootCA.pem {
        alias /etc/nginx/ssl/rootCA.pem;
        add_header Content-Type application/x-pem-file;
        add_header Content-Disposition 'attachment; filename="AI-ML-Lab-Root-CA.pem"';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Port 443: the actual application ────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;   # any name: the public host, the LAN name, or an IP

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Allow large file uploads (ZIP files up to 10 GB)
    client_max_body_size 10g;
    client_body_timeout  3600s;

    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff    always;
    add_header Referrer-Policy           "no-referrer" always;

    set $backend_upstream http://backend:4000;
    set $frontend_upstream http://frontend:80;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_request_buffering off;
    }

    location /socket.io/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_read_timeout 60s;
    }

    # Launcher installer download
    location /launcher/ {
        alias /opt/aiml-launcher/;
        autoindex on;
        add_header Content-Disposition 'attachment' always;
        types {
            application/octet-stream exe;
        }
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No error_page 404 -> /index.html here, deliberately.
        #
        # It used to turn EVERY 404 from the frontend into a 200 serving
        # index.html: a missing image, a missing font, and — the one that
        # actually hurt — a hashed JS chunk removed by a later deploy. The
        # browser then received HTML where it expected a module, so a stale
        # chunk failed as a parse error instead of a clean 404, and nothing
        # could tell "this page was updated" apart from "this page is broken".
        #
        # The SPA fallback belongs in the frontend container, which already
        # does it: try_files $uri $uri/ /index.html serves index.html for an
        # unknown ROUTE, while a missing ASSET returns a real 404.
    }
}
